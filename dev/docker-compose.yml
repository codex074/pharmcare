# Local development database only — mirrors production's layout:
# one Postgres cluster holding pharmshift's `postgres` database (users table)
# and the separate `pharmcare` database. Never used in production.
name: pharmcare-dev

services:
  pcdb:
    container_name: pharmcare-dev-db
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-superuser-pass
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pcdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pcdb-data:
