<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<title>ประวัติทั้งหมด · PharmCare OPD</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<x-dc>

<div style="width: 100%">
  <dc-import name="Patient" tab="all" theme="{{theme}}" hint-size="100%,1640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1640}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>


</body></html>
